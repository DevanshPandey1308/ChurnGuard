[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "0.1.0"
description = "Point-in-time customer churn and value data pipeline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.4", "scipy>=1.10", "lightgbm>=4.0", "fastapi>=0.110", "uvicorn>=0.27", "joblib>=1.3"]

[project.optional-dependencies]
analysis = ["lifetimes>=0.11.3", "shap>=0.46", "mlflow>=2.15", "matplotlib>=3.7,<4"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: churnguard-api:local
    ports:
      - "${CHURNGUARD_API_PORT:-8000}:8000"
    environment:
      CHURNGUARD_MODEL_DIR: /app/models
    volumes:
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4); d=json.load(r); assert r.status == 200 and d.get('status') == 'ok' and all(d.get(k) for k in ('churn_model_loaded','calibrator_loaded','future_value_model_loaded'))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
